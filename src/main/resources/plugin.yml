name: BossJullPlugin
version: '${project.version}'
main: com.fikjul.bossjull.falseprophet.FalseProphetPlugin
api-version: '1.20'
author: FikJul
description: The False Prophet - A custom villager boss fight plugin

commands:
  givefalsefaith:
    description: Give the False Faith totem summon item
    usage: /givefalsefaith [player] [amount]
    permission: bossjull.falseprophet
    permission-message: You don't have permission to use this command

permissions:
  bossjull.falseprophet:
    description: Allows managing the False Prophet boss
    default: op

name: VillagerFalseProphet
version: '${project.version}'
main: com.fikjul.falseprophet.FalseProphetPlugin
api-version: '1.20'
author: FikJul
description: The False Prophet - A corrupted villager boss fight

commands:
  givefalsefaith:
    description: Give the False Faith totem
    usage: /givefalsefaith [player] [amount]
    permission: falseprophet.give
    permission-message: You don't have permission to use this command

permissions:
  falseprophet.give:
    description: Allows giving the summon item
    default: op
